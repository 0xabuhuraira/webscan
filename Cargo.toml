[package]
name = "webscan"
version = "1.0.0"
edition = "2021"
authors = ["WebScan Contributors"]
description = "Production-quality Minecraft Java Edition discovery scanner - high-performance unprivileged TCP-based scanning"
license = "MIT"
repository = "https://github.com/0xabuhuraira/webscan"
readme = "README.md"

[[bin]]
name = "webscan"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ipnet = "2.10"
socket2 = "0.5"
rustls = { version = "0.23", features = ["std"] }
rustls-pemfile = "2.1"
hyper = { version = "1.4", features = ["full"] }
bytes = "1.6"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
parking_lot = "0.12"
lazy_static = "1.4"
regex = "1.10"
anyhow = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
async-trait = "0.1"
paste = "1.0"
crossbeam-channel = "0.5"
rand = "0.8"
num_cpus = "1.16"
nix = { version = "0.28", features = ["process"] }

[dev-dependencies]
tempfile = "3.9"
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
